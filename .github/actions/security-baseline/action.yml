name: GMA repository security baseline
description: Scan an owned source tree and emit SARIF, a CycloneDX SBOM and a payload-free summary.

inputs:
  scan-path:
    description: Repository-relative path to scan.
    required: false
    default: .
  output-directory:
    description: Repository-relative directory for generated evidence.
    required: false
    default: artifacts/security
  severity:
    description: Finding severities that fail the gate.
    required: false
    default: HIGH,CRITICAL
  skip-directories:
    description: Comma-separated generated or cache directories excluded from traversal.
    required: false
    default: .git,.tmp,.vs,artifacts,**/bin,**/obj,**/node_modules
  timeout:
    description: Maximum duration for each bounded Trivy pass.
    required: false
    default: 20m
  exception-file:
    description: Repository-relative bounded security exception contract.
    required: false
    default: .gma/security-exceptions.json

runs:
  using: composite
  steps:
    - name: Install Trivy
      uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
      with:
        version: v0.70.0
        cache: 'true'

    - name: Scan and generate evidence
      shell: bash
      env:
        OUTPUT_DIRECTORY: ${{ inputs.output-directory }}
        SCAN_PATH: ${{ inputs.scan-path }}
        SCAN_SEVERITY: ${{ inputs.severity }}
        SKIP_DIRECTORIES: ${{ inputs.skip-directories }}
        SCAN_TIMEOUT: ${{ inputs.timeout }}
        EXCEPTION_FILE: ${{ inputs.exception-file }}
        EXCEPTION_SCRIPT: ${{ github.action_path }}/convert-security-exceptions.ps1
        SUMMARY_SCRIPT: ${{ github.action_path }}/write-security-evidence-summary.ps1
      run: |
        set -euo pipefail
        mkdir -p "$OUTPUT_DIRECTORY"
        raw_report="$(mktemp "${RUNNER_TEMP:-/tmp}/gma-security.XXXXXX.json")"
        exception_ignore_file="$(mktemp "${RUNNER_TEMP:-/tmp}/gma-security-ignore.XXXXXX.yaml")"
        trap 'rm -f "$raw_report" "$exception_ignore_file"' EXIT

        IFS=',' read -ra configured_skip_directories <<< "$SKIP_DIRECTORIES"
        skip_arguments=()
        for directory in "${configured_skip_directories[@]}"; do
          if [[ -n "$directory" ]]; then
            skip_arguments+=(--skip-dirs "$directory")
          fi
        done

        exception_count="$(pwsh -NoLogo -NoProfile -File "$EXCEPTION_SCRIPT" \
          -InputPath "$EXCEPTION_FILE" \
          -OutputPath "$exception_ignore_file")"
        ignore_arguments=()
        if [[ "$exception_count" -gt 0 ]]; then
          ignore_arguments+=(--ignorefile "$exception_ignore_file")
        fi

        set +e
        trivy fs \
          --scanners vuln,secret,misconfig,license \
          --severity "$SCAN_SEVERITY" \
          --ignore-unfixed=false \
          --exit-code 1 \
          --format json \
          --output "$raw_report" \
          --timeout "$SCAN_TIMEOUT" \
          --skip-version-check \
          "${skip_arguments[@]}" \
          "${ignore_arguments[@]}" \
          "$SCAN_PATH"
        scan_exit_code=$?
        set -e

        evidence_exit_code=$scan_exit_code
        if [[ -s "$raw_report" ]]; then
          set +e
          trivy convert \
            --format sarif \
            --output "$OUTPUT_DIRECTORY/trivy-results.sarif" \
            "$raw_report"
          sarif_exit_code=$?

          trivy fs \
            --scanners vuln \
            --list-all-pkgs \
            --format cyclonedx \
            --output "$OUTPUT_DIRECTORY/sbom.cdx.json" \
            --timeout "$SCAN_TIMEOUT" \
            --skip-version-check \
            "${skip_arguments[@]}" \
            "$SCAN_PATH"
          sbom_exit_code=$?
          set -e

          if [[ "$sarif_exit_code" -ne 0 || "$sbom_exit_code" -ne 0 ]]; then
            evidence_exit_code=2
          fi
        else
          evidence_exit_code=2
        fi

        pwsh -NoLogo -NoProfile -File "$SUMMARY_SCRIPT" \
          -InputPath "$raw_report" \
          -OutputPath "$OUTPUT_DIRECTORY/security-summary.json" \
          -ScanExitCode "$evidence_exit_code"

        exit "$evidence_exit_code"
